<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Recetas</title>
    <link rel="stylesheet" href="/styles/styleFeed.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="/img/imgLogo.png" alt="Logo">
            </div>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/perfil">Perfil</a></li>
                <li><a href="/crear-receta">Crear Receta</a></li>
                <li><a href="/login">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="recetas-container">
            <h1>Recetas Recientes</h1>
            <div class="recetas-grid">
                <!-- Ejemplo de una receta -->
                <div class="receta">
                    <div class="receta-imagen-container">
                        <img src="/img/chVerdes.jpeg" alt="Título de la receta" class="receta-imagen">
                    </div>
                    <h2>Título de la Receta</h2>
                    <p><strong>Publicado por:</strong> UsuarioEjemplo</p>
                    <p><strong>Tiempo de preparación:</strong> 30 minutos</p>
                    <p><strong>Dificultad:</strong> Fácil</p>
                    <div class="reacciones">
                        <button class="btn-like">👍 12</button>
                        <button class="btn-dislike">👎 2</button>
                    </div>
                    <button class="btn-comentarios" onclick="mostrarComentarios(1)">💬 Comentarios</button>
                    <a href="/receta/1" class="btn-ver-receta">Ver Receta</a>
                </div>

                <!-- Otras recetas pueden ser añadidas dinámicamente aquí -->
            </div>
        </section>
    </main>

    <!-- Ventana de comentarios -->
    <div id="modalComentarios" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" onclick="cerrarModal()">&times;</span>
            <h2>Comentarios</h2>
            <div class="comentarios-lista">
                <!-- Comentarios se cargarán aquí -->
            </div>
            <form class="form-comentario">
                <textarea placeholder="Escribe un comentario..." required></textarea>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Recetas. Todos los derechos reservados.</p>
    </footer>

    <script>
        function mostrarComentarios(recetaId) {
            // Aquí puedes cargar los comentarios de la receta con el ID recetaId
            const modal = document.getElementById('modalComentarios');
            modal.style.display = 'block';
        }

        function cerrarModal() {
            const modal = document.getElementById('modalComentarios');
            modal.style.display = 'none';
        }

        // Cerrar modal si se hace clic fuera de él
        window.onclick = function(event) {
            const modal = document.getElementById('modalComentarios');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
