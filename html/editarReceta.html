<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Receta</title>
    <link rel="stylesheet" href="/styles/styleEditarReceta.css">
</head>
<body>
    <div class="container">
        <!-- Sección de la receta -->
        <section id="recetaSection">
            <form>
                <!-- Campo para editar el título de la receta -->
                <div>
                    <label for="tituloReceta"><b>Título de la receta:</b></label>
                    <input
                        type="text"
                        id="tituloReceta"
                        placeholder="Título de la receta"
                        value="{tituloReceta}"
                        required
                    >
                </div>
                <img class="imagenReceta" src="/img/chVerdes.jpeg" alt="{tituloReceta}" id="imagenReceta-{idreceta}">
                
                <!-- Campo: Imagen de la receta -->
                <div>
                    <label for="imagenReceta">Imagen de la receta:</label>
                    <div class="file-upload">
                        <input type="file" id="imagenReceta" accept="image/*" onchange="mostrarVistaPrevia(event)">
                        <label for="imagenReceta" class="file-upload-label">Elegir archivo</label>
                        <div id="vistaPrevia" class="vista-previa"></div>
                    </div>
                </div>
            </form>
        </section>

        <!-- Sección de descripción y formulario -->
        <section id="descripcion_section">
            <form>
                <!-- Encabezado con botones de acción -->
                <div class="formHeader">
                    <h1>Descripción</h1>
                    <div class="buttonWrapper">
                        <button class="iconButton" type="button" onclick="window.location.href='/perfil'" id="btnCancelar">
                            <img src="/img/imgBotonCancelar.png" alt="Cancelar" title="Cancelar"> Cancelar
                        </button>
                        <button class="iconButton" type="submit" id="btnGuardar">
                            <img src="/img/imgBotonGuardar.png" alt="Guardar" title="Guardar"> Guardar
                        </button>
                    </div>
                </div>

                <!-- Campo: Tiempo de preparación -->
                <div>
                    <label for="tiempoPreparacion"><b>Tiempo de preparación (minutos):</b></label>
                    <input
                        type="number"
                        id="tiempoPreparacion"
                        placeholder="Tiempo en minutos"
                        required
                        min="1"
                    >
                </div>

                <!-- Campo: Dificultad -->
                <div>
                    <label for="dificultad"><b>Dificultad:</b></label>
                    <select id="dificultad" required>
                        <option value="Facil">Fácil</option>
                        <option value="Medio">Medio</option>
                        <option value="Dificil">Difícil</option>
                    </select>
                </div>

                <!-- Campo: Número de raciones -->
                <div>
                    <label for="numeroRaciones"><b>Raciones:</b></label>
                    <input
                        type="number"
                        id="numeroRaciones"
                        placeholder="Número de raciones"
                        required
                        min="1"
                    >
                </div>

                <!-- Campo: Descripción -->
                <div>
                    <label for="descripcionTextArea"><b>Descripción:</b></label>
                    <textarea
                        id="descripcionTextArea"
                        rows="10"
                        placeholder="Escribe la descripción de la receta..."
                    ></textarea>
                </div>
            </form>
        </section>
    </div>
    <script>
        function mostrarVistaPrevia(event) {
            const vistaPrevia = document.getElementById('vistaPrevia');
            const archivo = event.target.files[0];
            const lector = new FileReader();
            lector.onload = function(e) {
                vistaPrevia.innerHTML = `<img src="${e.target.result}" alt="Vista previa" style="max-width: 40%; height: auto;">`;
            }
            lector.readAsDataURL(archivo);
        }
    </script>
</body>
</html>
