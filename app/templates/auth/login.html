<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/app/static/css/styleLogin.css">
</head>
<body>
    <main class="white">
        <section class="loginContainer">
            <!-- Panel izquierdo: Logo -->
            <section class="left_pane">
                <img id="logo" src="/app/static/img/imgLogo.png" class="logo" alt="Logo">
            </section>

            <!-- Panel derecho: Formulario de inicio de sesión -->
            <section class="right_pane">
                <h2>Inicio de sesión</h2>
                <form method="get">
                    <div>
                        <label for="username">Correo:</label>
                        <input type="email" id="username" name="username" placeholder="Ingresa tu correo" required>
                    </div>
                    <div>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                    <button type="submit">Iniciar sesión</button>
                    <div id="mensaje_registro">
                        <p>¿No tienes una cuenta? <a href="/registro">¡Crea una ahora mismo!</a></p>
                    </div>
                </form>
            </section>
        </section>
    </main>
</body>
</html>
